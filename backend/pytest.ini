[pytest]
# Run tests from the backend/ directory
testpaths = tests

# Minimum pytest version required
minversion = 8.0

# Output options
addopts =
    --tb=short
    --strict-markers
    -v

# Asyncio mode (for future async tests)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Custom markers (add new markers here to avoid PytestUnknownMarkWarning)
markers =
    unit: Pure unit tests with no I/O
    integration: Tests that require external services (e.g. database)
    slow: Tests that are notably slower than average
