# =============================================================================
# Alembic configuration for AI-NBA Readiness System backend
# =============================================================================

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = migrations

# Template used to generate migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# Maximum length of the slug portion of the revision filename
truncate_slug_length = 40

# Revision environment — the database URL is pulled from the app's
# Settings object in migrations/env.py; it is NOT hard-coded here.
# (The sqlalchemy.url key is intentionally left blank.)
sqlalchemy.url =

# Prepend sys.path entries so that "app" is importable from migrations/env.py
prepend_sys_path = .

# ---------------------------------------------------------------------------
# Logging — mirrors a standard Python logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
